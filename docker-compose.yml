# makaseta の起動構成
#
# アクセスするポートとバインド先は .env の MAKASETA_PORT / MAKASETA_BIND で変えられます。
# 既定は 8081 です（8080 は VS Code Server などとぶつかりやすいため避けています）。
# このファイルの ports を直接書き換えても構いません。
#   例: "0.0.0.0:3000:8080"  -> LAN内の他のPCから http://<このPCのIP>:3000 でアクセス
# コンテナ内のアプリは常に 8080 で待ち受けます（右側の 8080 は変えないでください）。

services:
  app:
    build:
      context: .
      args:
        APP_UID: ${MAKASETA_UID:-1000}
        APP_GID: ${MAKASETA_GID:-1000}
    image: makaseta:local
    ports:
      - "${MAKASETA_BIND:-127.0.0.1}:${MAKASETA_PORT:-8081}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-makaseta}:${POSTGRES_PASSWORD:-makaseta}@db:5432/${POSTGRES_DB:-makaseta}
      DATA_DIR: /data
      MODELS_CONFIG: /app/config/models.yaml
      AWS_DIR: /home/app/.aws
      LIBRARY_ROOT: /library
      SKILLS_ROOT: /skills
      LIBRARY_HOST_PATH: ${LIBRARY_DIR:-./library}
      WORK_ROOT: /data/work
      SANDBOX_URL: http://sandbox:8000
    volumes:
      - ./data/files:/data/files
      - ./data/work:/data/work
      - ${LIBRARY_DIR:-./library}:/library
      - ./skills:/skills
      - ./config:/app/config:ro
      - ${AWS_CONFIG_DIR:-~/.aws}:/home/app/.aws:ro
    networks: [default, sandbox]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Runs skill scripts for agents. No database, no API keys; offline unless SANDBOX_OFFLINE=false.
  sandbox:
    build:
      context: ./sandbox
      args:
        RUNNER_UID: ${MAKASETA_UID:-1000}
        RUNNER_GID: ${MAKASETA_GID:-1000}
    image: makaseta-sandbox:local
    volumes:
      - ./data/work:/work
      - ./skills:/skills:ro
    networks: [sandbox]
    mem_limit: ${SANDBOX_MEMORY:-2g}
    cpus: ${SANDBOX_CPUS:-2}
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-makaseta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-makaseta}
      POSTGRES_DB: ${POSTGRES_DB:-makaseta}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

networks:
  default: {}
  sandbox:
    # true: the sandbox cannot reach the internet (packages must be in the image). false: it can.
    internal: ${SANDBOX_OFFLINE:-true}
